<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23386e"/>
      <stop offset="0.55" stop-color="#2a2150"/>
      <stop offset="1" stop-color="#401f4a"/>
    </linearGradient>
  </defs>
  <!-- maskable: 全面塗り(セーフゾーンは中央80%) -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- カード -->
  <g transform="rotate(-10 256 256)">
    <rect x="156" y="116" width="200" height="280" rx="28" fill="#fbf7ef" stroke="#2a2f55" stroke-width="10"/>
    <text x="256" y="248" font-family="Segoe UI, Meiryo, sans-serif" font-weight="900" font-size="120" fill="#1f2440" text-anchor="middle">R</text>
    <text x="256" y="350" font-family="Segoe UI, Meiryo, sans-serif" font-weight="900" font-size="120" fill="#ef5350" text-anchor="middle">L</text>
  </g>
  <!-- エンブレムの色ドット -->
  <circle cx="120" cy="392" r="22" fill="#ef5350"/>
  <circle cx="178" cy="408" r="22" fill="#42a5f5"/>
  <circle cx="334" cy="408" r="22" fill="#66bb6a"/>
  <circle cx="392" cy="392" r="22" fill="#ffca28"/>
</svg>
